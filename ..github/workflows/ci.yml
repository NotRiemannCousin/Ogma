name: CI Build and Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  linux:
    runs-on: ubuntu-latest
    container: sourcemation/gcc-16:latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMYPROJECTNAME_BUILD_EXAMPLES=OFF -DMYPROJECTNAME_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Run Tests
        run: ctest --test-dir build -C Release --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMYPROJECTNAME_BUILD_EXAMPLES=OFF -DMYPROJECTNAME_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Run Tests
        run: ctest --test-dir build -C Release --output-on-failure